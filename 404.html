<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Resolve the theme before first paint so there's no flash of the wrong
         theme. Dark is the default; light is opt-in and persisted. -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="stylesheet" href="/assets/css/index.css" />

      rel="stylesheet"

      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      .not-found {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px 20px;
      }
      .not-found h1 {
        font-size: clamp(4rem, 12vw, 8rem);
        color: var(--primary-color);
        margin: 0;
        line-height: 1;
      }
      .not-found p {
        font-size: 1.25rem;
        margin: 16px 0 32px;
        color: var(--light-gray-color);
      }
      .not-found .btn-home {
        display: inline-block;
        padding: 14px 28px;
        border: 1px solid var(--primary-color);
        border-radius: 8px;
        color: var(--on-background-color);
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .not-found .btn-home:hover {
        background-color: var(--primary-color);
        color: #fff;
      }
    </style>
